name: offline-check

# Runs evals/offline/check.py: the real Claude Code, Codex CLI and Copilot CLI
# binaries against a local mock model. No secrets, no tokens, no network beyond the
# package registry. Pull requests test the pinned versions. Pushes to main, the
# weekly schedule and manual runs also test the newest releases, to see a change early.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: Pinned versions (Claude Code 2.1.325, Codex 0.171.0, Copilot CLI 1.0.114)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The versions the check was last tested against. Bump them deliberately,
      # together with the "provato su" line in MANUALE.md.
      - name: Install the agents
        run: npm install --global @anthropic-ai/claude-code@2.1.325 @openai/codex@0.171.0 @github/copilot@1.0.114
      # CODEX and COPILOT make those checks required: a missing binary fails the job.
      - name: Offline check
        env:
          CODEX: codex
          COPILOT: copilot
        run: python3 evals/offline/check.py

  latest:
    name: Latest versions (early warning)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the newest agents
        run: npm install --global @anthropic-ai/claude-code@latest @openai/codex@latest @github/copilot@latest
      - name: Show the versions under test
        run: |
          claude --version
          codex --version
          copilot --version
      - name: Offline check
        env:
          CODEX: codex
          COPILOT: copilot
        run: python3 evals/offline/check.py
