name: offline-check

# Runs evals/offline/check.py: the real Claude Code binary against a local mock
# model. No secrets, no tokens, no network beyond the package registry.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned to the version the check was written and tested against.
      # Bump it deliberately, together with the "provato su" line in MANUALE.md.
      - name: Install Claude Code 2.1.310
        run: npm install --global @anthropic-ai/claude-code@2.1.310
      - name: Offline check
        run: python3 evals/offline/check.py
