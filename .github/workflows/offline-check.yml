name: offline-check

# Runs evals/offline/check.py: the real Claude Code and OpenCode binaries
# against a local mock model. No secrets, no tokens, no network beyond the
# package registry. Pull requests test the pinned versions. Pushes to main, the
# weekly schedule and manual runs also test the newest releases, to see a change early.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: Pinned versions (Claude Code 2.1.325, OpenCode 2.3.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The versions the check was last tested against. Bump them deliberately,
      # together with the "provato su" line in MANUALE.md.
      - name: Install the agents
        run: npm install --global @anthropic-ai/claude-code@2.1.325 @opencode/cli@2.3.2
      # OPENCODE makes that check required: a missing binary fails the job.
      - name: Offline check
        env:
          OPENCODE: opencode
        run: python3 evals/offline/check.py

  latest:
    name: Latest versions (early warning)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the newest agents
        run: npm install --global @anthropic-ai/claude-code@latest @opencode/cli@latest
      - name: Show the versions under test
        run: |
          claude --version
          opencode --version
      - name: Offline check
        env:
          OPENCODE: opencode
        run: python3 evals/offline/check.py
